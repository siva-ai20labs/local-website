name: Backend

# Runs only when the backend or a package it depends on changes.
# backend imports @local-website/db AND @local-website/types.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/db/**"
      - "packages/types/**"
      - "package-lock.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "packages/db/**"
      - "packages/types/**"
      - "package-lock.json"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client (Cloudflare runtime)
        run: npm run generate -w @local-website/db
      - name: Typecheck
        run: npm run typecheck -w backend

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client (Cloudflare runtime)
        run: npm run generate -w @local-website/db
      - name: Deploy backend
        run: npm run deploy -w backend
